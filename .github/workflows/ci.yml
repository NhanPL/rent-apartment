name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend Check And Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  frontend-check:
    name: Frontend Lint And Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  backend-integration:
    name: Backend PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

  end-to-end:
    name: Playwright Critical Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentmate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rentmate_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rentmate_e2e
      DB_SSL: false
      JWT_ACCESS_SECRET: e2e-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: e2e-refresh-secret-different-and-at-least-32-characters
      DOCUMENT_ACCESS_SECRET: e2e-document-secret-with-at-least-32-characters
      AUDIT_IP_HASH_SECRET: e2e-audit-secret-with-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      FRONTEND_URL: http://127.0.0.1:4173
      DOCUMENT_DELIVERY_BASE_URL: http://127.0.0.1:4000
      CLOUDINARY_CLOUD_NAME: e2e
      CLOUDINARY_API_KEY: e2e-api-key
      CLOUDINARY_API_SECRET: e2e-api-secret
      SMTP_ENABLED: false
      RATE_LIMIT_GLOBAL_MAX: 10000
      RATE_LIMIT_LOGIN_MAX: 10000
      RATE_LIMIT_REFRESH_MAX: 10000
      RATE_LIMIT_PASSWORD_RESET_MAX: 10000
      RATE_LIMIT_UPLOAD_SIGNATURE_MAX: 10000
      RATE_LIMIT_PAYMENT_PROOF_MAX: 10000
      VITE_API_BASE_URL: http://127.0.0.1:4000/api
      E2E_API_URL: http://127.0.0.1:4000
      E2E_WEB_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            front-end/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Migrate and seed E2E database
        run: |
          npm run db:migrate -- --seed
          npm run db:seed:e2e
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: front-end

      - name: Build frontend
        run: npm run build
        working-directory: front-end

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: front-end

      - name: Run critical E2E workflows
        run: npm run test:e2e
        working-directory: front-end

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: front-end/playwright-report
          retention-days: 7

  dependency-audit:
    name: Dependency Audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, front-end]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install locked dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}

      - name: Audit dependencies
        run: npm run audit
        working-directory: ${{ matrix.project }}
